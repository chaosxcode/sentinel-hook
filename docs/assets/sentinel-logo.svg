<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Sentinel logo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d8d" />
      <stop offset="100%" stop-color="#6f52ff" />
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="240" fill="url(#bg)"/>

  <g filter="url(#soft)" transform="translate(0 0)">
    <circle cx="512" cy="512" r="320" fill="none" stroke="url(#ring)" stroke-width="36" stroke-linecap="round"/>
    <circle cx="512" cy="512" r="290" fill="#0b1220"/>

    <path d="M320 352h280a84 84 0 0 1 0 168c-72 0-86 64-86 64h-40c0-86 56-148 126-148a128 128 0 0 1 0 256H318"
      fill="none" stroke="url(#ring)" stroke-width="36" stroke-linejoin="round" stroke-linecap="round"/>

    <path d="M486 300l124 212-124 212" fill="none" stroke="url(#line)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="486" cy="260" r="46" fill="#ff2d8d"/>
    <path d="M512 210l0 110" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

    <path d="M650 610a138 138 0 0 1-138 138" fill="none" stroke="#94a3b8" stroke-width="18" stroke-dasharray="10 14"/>

    <path d="M356 610h188" stroke="#ff2d8d" stroke-width="18" stroke-linecap="round"/>
  </g>

  <path d="M262 748h500" stroke="#ff2d8d" stroke-width="18" stroke-linecap="round"/>
</svg>
